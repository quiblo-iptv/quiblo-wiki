name: Deploy wiki to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Only the deployment needs write access, and only to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# A queued deploy supersedes a running one; a half-finished build is never published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The tests are cheap and they check the thing most likely to rot in a hand-authored
      # wiki: a cross-reference pointing at a page that no longer exists.
      - run: npm test

      # A project site is served from /<repo>/, so the base href has to match or every
      # asset 404s. Derived from the repository name rather than hardcoded.
      #
      # The build prerenders every route into its own HTML file. That is what makes the site
      # indexable: GitHub Pages serves a file at 200, and serves anything without one at 404,
      # and a crawler throws a 404 away before it runs the JavaScript that would have drawn
      # the page. Before this, every route but the front page was a 404.
      - run: npx ng build --configuration production --base-href "/${GITHUB_REPOSITORY#*/}/"

      # Sitemap and robots, with the real public origin so the URLs in them resolve. This
      # also fails the build if the pages that were built and the pages the content declares
      # are not the same set.
      - run: node tools/seo.mjs "${{ steps.pages.outputs.base_url }}"

      # 404.html for paths that genuinely have no page, and .nojekyll.
      - run: node tools/pages.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/quiblo-wiki/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
